[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "cancun"          # obrigatório: ReentrancyGuardTransient usa TSTORE/TLOAD
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

# Plugin openzeppelin-foundry-upgrades
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64

# ───────────── Perfil Anvil (rede local) ─────────────
[profile.anvil]
eth_rpc_url = "http://127.0.0.1:8545"
chain_id = 31337
gas_limit = 30000000
gas_price = 0
block_timestamp = 1
sender = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"   # conta #0 do Anvil

# ───────────── Perfil CI ─────────────
[profile.ci]
fuzz = { runs = 2000 }
invariant = { runs = 512, depth = 128 }
verbosity = 3

[rpc_endpoints]
anvil   = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"